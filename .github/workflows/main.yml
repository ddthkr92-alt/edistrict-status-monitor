name: eDistrict Status Monitor

on:

  # Manual run भी उपलब्ध रहेगा
  workflow_dispatch:

  # हर 5 मिनट में automatic monitoring
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"


# एक समय में एक ही monitoring run चले
concurrency:
  group: edistrict-status-monitor
  cancel-in-progress: false


jobs:

  monitor-status:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # Node.js
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ========================================================
      # Install dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin fast-xml-parser


      # ========================================================
      # Run e-District monitor
      # ========================================================

      - name: Monitor e-District applications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |

          cat > monitor.js <<'EOF'

          const admin =
            require("firebase-admin");

          const {
            XMLParser
          } =
            require("fast-xml-parser");


          // ======================================================
          // Firebase
          // ======================================================

          const DATABASE_URL =
            "https://edistrict-status-test-default-rtdb.asia-southeast1.firebasedatabase.app";


          if (
            !process.env.FIREBASE_SERVICE_ACCOUNT_JSON
          ) {

            console.error(
              "FIREBASE_SERVICE_ACCOUNT_JSON secret नहीं मिला।"
            );

            process.exit(1);
          }


          let serviceAccount;


          try {

            serviceAccount =
              JSON.parse(
                process.env.FIREBASE_SERVICE_ACCOUNT_JSON
              );

          } catch (error) {

            console.error(
              "Firebase service account JSON invalid है।"
            );

            process.exit(1);
          }


          admin.initializeApp({

            credential:
              admin.credential.cert(
                serviceAccount
              ),

            databaseURL:
              DATABASE_URL

          });


          const database =
            admin.database();


          const messaging =
            admin.messaging();


          // ======================================================
          // e-District SOAP API
          // ======================================================

          const SOAP_ADDRESS =
            "http://164.100.181.28/nichqreport/responseup.asmx";


          const SOAP_ACTION =
            "http://tempuri.org/retAppStatus";


          const NAMESPACE =
            "http://tempuri.org/";


          const OPERATION_NAME =
            "retAppStatus";


          // ======================================================
          // Helpers
          // ======================================================

          function safe(
            value
          ) {

            if (
              value === null
                  ||
              value === undefined
            ) {

              return "";
            }


            return String(
              value
            ).trim();
          }


          function normalizeStatus(
            value
          ) {

            return safe(
              value
            )
              .replace(
                /\s+/g,
                " "
              )
              .trim()
              .toLowerCase();
          }


          // ======================================================
          // e-District API call
          // ======================================================

          async function checkEDistrictStatus(
            applicationNumber
          ) {

            const soapBody =
              `<?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xmlns:xsd="http://www.w3.org/2001/XMLSchema"
              xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

              <soap:Body>

                <${OPERATION_NAME}
                    xmlns="${NAMESPACE}">

                  <application_no>
                    ${applicationNumber}
                  </application_no>

                </${OPERATION_NAME}>

              </soap:Body>

          </soap:Envelope>`;


            const response =
              await fetch(
                SOAP_ADDRESS,
                {

                  method: "POST",

                  headers: {

                    "Content-Type":
                      "text/xml; charset=utf-8",

                    "SOAPAction":
                      `"${SOAP_ACTION}"`

                  },

                  body:
                    soapBody,

                  signal:
                    AbortSignal.timeout(
                      30000
                    )

                }
              );


            if (
              !response.ok
            ) {

              throw new Error(
                `e-District HTTP error: ${response.status}`
              );
            }


            const xml =
              await response.text();


            const parser =
              new XMLParser(
                {
                  ignoreAttributes: false,
                  removeNSPrefix: true
                }
              );


            const parsed =
              parser.parse(
                xml
              );


            const envelope =
              parsed.Envelope
                  ||
              parsed["soap:Envelope"];


            const body =
              envelope
                  ?.Body
                  ||
              parsed.Body;


            const responseObject =
              body
                  ?.retAppStatusResponse;


            const resultObject =
              responseObject
                  ?.retAppStatusResult;


            if (
              !resultObject
            ) {

              throw new Error(
                "e-District response में result नहीं मिला।"
              );
            }


            return {

              name:
                safe(
                  resultObject.name
                ),

              status:
                safe(
                  resultObject.status
                ),

              location:
                safe(
                  resultObject.location
                ),

              movedOn:
                safe(
                  resultObject.movedon
                ),

              download:
                safe(
                  resultObject.ic_download
                ),

              service:
                safe(
                  resultObject.service
                )

            };
          }


          // ======================================================
          // Send FCM status-change notification
          // ======================================================

          async function sendStatusChangeNotification(
            fcmToken,
            applicationNumber,
            service,
            newStatus,
            location
          ) {

            if (
              !fcmToken
            ) {

              console.log(
                "FCM token उपलब्ध नहीं है।"
              );

              return false;
            }


            const message = {

              token:
                fcmToken,

              data: {

                type:
                  "STATUS_CHANGE",

                applicationNumber:
                  safe(
                    applicationNumber
                  ),

                newStatus:
                  safe(
                    newStatus
                  ),

                location:
                  safe(
                    location
                  )

              },

              android: {

                priority:
                  "high"

              }

            };


            try {

              const messageId =
                await messaging.send(
                  message
                );


              console.log(
                "FCM data-only notification sent successfully."
              );


              console.log(
                "Message ID:",
                messageId
              );


              return true;


            } catch (error) {

              console.error(
                "FCM notification failed."
              );


              console.error(
                error.message
              );


              return false;
            }
          }


          // ======================================================
          // Main monitor
          // ======================================================

          async function monitorApplications() {

            console.log(
              "========================================"
            );

            console.log(
              "e-District Status Monitor"
            );

            console.log(
              "Started:",
              new Date().toISOString()
            );

            console.log(
              "========================================"
            );


            const usersSnapshot =
              await database
                .ref(
                  "users"
                )
                .once(
                  "value"
                );


            const users =
              usersSnapshot.val()
                  || {};


            let totalApplications =
              0;


            let checkedApplications =
              0;


            let unchangedApplications =
              0;


            let changedApplications =
              0;


            let notificationCount =
              0;


            let failedApplications =
              0;


            for (
              const uid
              of Object.keys(
                users
              )
            ) {

              const user =
                users[uid]
                    || {};


              const fcmToken =
                safe(
                  user.fcmToken
                );


              const applications =
                user.applications
                    || {};


              for (
                const applicationId
                of Object.keys(
                  applications
                )
              ) {

                totalApplications++;


                const application =
                  applications[
                    applicationId
                  ]
                      || {};


                const applicationNumber =
                  safe(
                    application.applicationNumber
                      ||
                    applicationId
                  );


                if (
                  !applicationNumber
                ) {

                  failedApplications++;

                  continue;
                }


                try {

                  const result =
                    await checkEDistrictStatus(
                      applicationNumber
                    );


                  checkedApplications++;


                  const oldStatus =
                    safe(
                      application.currentStatus
                    );


                  const newStatus =
                    safe(
                      result.status
                    );


                  const oldNormalized =
                    normalizeStatus(
                      oldStatus
                    );


                  const newNormalized =
                    normalizeStatus(
                      newStatus
                    );


                  const statusChanged =
                    oldNormalized !==
                    newNormalized;


                  const previousNotifiedStatus =
                    safe(
                      application.lastNotifiedStatus
                    );


                  const previousNotifiedNormalized =
                    normalizeStatus(
                      previousNotifiedStatus
                    );


                  const shouldNotify =
                    statusChanged
                        &&
                    newNormalized
                        !==
                    previousNotifiedNormalized;


                  const now =
                    Date.now();


                  // =================================================
                  // Status unchanged
                  // =================================================

                  if (
                    !statusChanged
                  ) {

                    unchangedApplications++;


                    await database
                      .ref(
                        `users/${uid}/applications/${applicationId}`
                      )
                      .update(
                        {

                          lastCheckedAt:
                            now,

                          updatedAt:
                            now

                        }
                      );


                    continue;
                  }


                  // =================================================
                  // Status changed
                  // =================================================

                  changedApplications++;


                  console.log(
                    "Status change detected."
                  );


                  // -------------------------------------------------
                  // Send notification
                  // -------------------------------------------------

                  if (
                    shouldNotify
                        &&
                    fcmToken
                  ) {

                    const sent =
                      await sendStatusChangeNotification(
                        fcmToken,
                        applicationNumber,
                        result.service,
                        newStatus,
                        result.location
                      );


                    if (
                      sent
                    ) {

                      notificationCount++;


                      // Save only the last notified status.
                      // This allows A → B → A to notify again.

                      await database
                        .ref(
                          `users/${uid}/applications/${applicationId}`
                        )
                        .update(
                          {

                            lastNotifiedStatus:
                              newStatus

                          }
                        );
                    }

                  } else if (
                    shouldNotify
                        &&
                    !fcmToken
                  ) {

                    console.log(
                      "Status changed but FCM token नहीं मिला।"
                    );
                  }


                  // =================================================
                  // Save latest e-District status
                  // =================================================

                  await database
                    .ref(
                      `users/${uid}/applications/${applicationId}`
                    )
                    .update(
                      {

                        currentStatus:
                          newStatus,

                        location:
                          result.location,

                        lastUpdate:
                          result.movedOn,

                        updatedAt:
                          now,

                        lastCheckedAt:
                          now

                      }
                    );
                }


                catch (error) {

                  failedApplications++;


                  console.error(
                    "Application check failed."
                  );


                  console.error(
                    error.message
                  );
                }
              }
            }


            // ======================================================
            // Summary
            // ======================================================

            console.log(
              "========================================"
            );

            console.log(
              "Monitoring completed."
            );


            console.log(
              "Total applications:",
              totalApplications
            );


            console.log(
              "Checked:",
              checkedApplications
            );


            console.log(
              "Unchanged:",
              unchangedApplications
            );


            console.log(
              "Status changed:",
              changedApplications
            );


            console.log(
              "Notifications sent:",
              notificationCount
            );


            console.log(
              "Failed:",
              failedApplications
            );


            console.log(
              "Completed:",
              new Date().toISOString()
            );


            console.log(
              "========================================"
            );
          }


          // ======================================================
          // Run
          // ======================================================

          monitorApplications()

            .then(
              () => {

                process.exit(
                  0
                );

              }
            )

            .catch(
              error => {

                console.error(
                  "Monitoring failed."
                );

                console.error(
                  error
                );

                process.exit(
                  1
                );
              }
            );

          EOF


          node monitor.js
