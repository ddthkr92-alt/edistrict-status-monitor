name: eDistrict Status Monitor

on:
  workflow_dispatch:

jobs:

  monitor-status:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Node.js
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 3. Dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin fast-xml-parser


      # ==========================================
      # 4. Monitor + FCM
      # ==========================================

      - name: Monitor e-District applications

        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

        run: |

          cat > monitor-edistrict.js <<'EOF'

          const {
            initializeApp,
            cert
          } = require("firebase-admin/app");


          const {
            getDatabase
          } = require("firebase-admin/database");


          const {
            getMessaging
          } = require("firebase-admin/messaging");


          const {
            XMLParser
          } = require("fast-xml-parser");


          // ==========================================
          // Firebase
          // ==========================================

          const DATABASE_URL =
            "https://edistrict-status-test-default-rtdb.asia-southeast1.firebasedatabase.app";


          // ==========================================
          // e-District API
          // ==========================================

          const SOAP_ADDRESS =
            "http://164.100.181.28/nichqreport/responseup.asmx";


          const SOAP_ACTION =
            "http://tempuri.org/retAppStatus";


          const NAMESPACE =
            "http://tempuri.org/";


          // ==========================================
          // Main
          // ==========================================

          async function main() {

            console.log(
              "=========================================="
            );

            console.log(
              "eDistrict Status Monitor + FCM"
            );

            console.log(
              "=========================================="
            );


            // ========================================
            // Secret
            // ========================================

            if (
              !process.env.FIREBASE_SERVICE_ACCOUNT_JSON
            ) {

              throw new Error(
                "Firebase service account secret is missing."
              );

            }


            const serviceAccount =
              JSON.parse(
                process.env.FIREBASE_SERVICE_ACCOUNT_JSON
              );


            // ========================================
            // Firebase Admin
            // ========================================

            initializeApp({

              credential:
                cert(serviceAccount),

              databaseURL:
                DATABASE_URL

            });


            const db =
              getDatabase();


            const messaging =
              getMessaging();


            console.log(
              "Firebase Admin initialized successfully."
            );


            // ========================================
            // Read users
            // ========================================

            const usersSnapshot =
              await db
                .ref("users")
                .once("value");


            if (
              !usersSnapshot.exists()
            ) {

              console.log(
                "No users found."
              );

              return;

            }


            const users =
              usersSnapshot.val();


            const applications = [];


            // ========================================
            // Collect applications
            // ========================================

            for (
              const uid
              of Object.keys(users)
            ) {

              const user =
                users[uid];


              if (
                !user
                || !user.applications
              ) {

                continue;

              }


              for (
                const applicationId
                of Object.keys(
                  user.applications
                )
              ) {

                const application =
                  user.applications[
                    applicationId
                  ];


                if (
                  !application
                  || !application.applicationNumber
                ) {

                  continue;

                }


                applications.push({

                  uid:
                    uid,

                  applicationId:
                    applicationId,

                  applicationNumber:
                    String(
                      application.applicationNumber
                    ),

                  applicantName:
                    String(
                      application.applicantName
                      || ""
                    ),

                  service:
                    String(
                      application.service
                      || ""
                    ),

                  currentStatus:
                    String(
                      application.currentStatus
                      || ""
                    ),

                  lastNotifiedStatus:
                    String(
                      application.lastNotifiedStatus
                      || ""
                    ),

                  fcmToken:
                    String(
                      user.fcmToken
                      || ""
                    )

                });

              }

            }


            console.log(
              "Applications found: "
                + applications.length
            );


            if (
              applications.length === 0
            ) {

              return;

            }


            // ========================================
            // XML parser
            // ========================================

            const parser =
              new XMLParser({

                ignoreAttributes:
                  true,

                removeNSPrefix:
                  true,

                trimValues:
                  true

              });


            // ========================================
            // Counters
            // ========================================

            let checkedCount =
              0;


            let unchangedCount =
              0;


            let changedCount =
              0;


            let notificationCount =
              0;


            let failedCount =
              0;


            // ========================================
            // Monitor applications
            // ========================================

            for (
              const application
              of applications
            ) {

              try {

                const result =
                  await checkEdistrictStatus(
                    application.applicationNumber,
                    parser
                  );


                checkedCount++;


                const oldStatus =
                  normalizeStatus(
                    application.currentStatus
                  );


                const newStatus =
                  normalizeStatus(
                    result.status
                  );


                // ==================================
                // No status change
                // ==================================

                if (
                  oldStatus === newStatus
                ) {

                  unchangedCount++;


                  console.log(
                    "Application checked: STATUS UNCHANGED"
                  );


                  await updateLastChecked(
                    db,
                    application
                  );


                  continue;

                }


                // ==================================
                // Status changed
                // ==================================

                changedCount++;


                console.log(
                  "Application checked: STATUS CHANGED"
                );


                // ==================================
                // Send notification only when
                // this status was not notified before
                // ==================================

                const alreadyNotified =
                  normalizeStatus(
                    application.lastNotifiedStatus
                  )
                  === newStatus;


                if (
                  !alreadyNotified
                  && application.fcmToken
                ) {

                  await sendStatusNotification(
                    messaging,
                    application,
                    result
                  );


                  notificationCount++;


                  // Save notified status
                  await db
                    .ref(
                      "users/"
                      + application.uid
                      + "/applications/"
                      + application.applicationId
                      + "/lastNotifiedStatus"
                    )
                    .set(
                      newStatus
                    );


                  console.log(
                    "FCM notification sent successfully."
                  );

                } else if (
                  alreadyNotified
                ) {

                  console.log(
                    "Notification already sent for this status."
                  );

                } else {

                  console.log(
                    "FCM token not available."
                  );

                }


                // ==================================
                // Update application
                // ==================================

                await updateApplication(
                  db,
                  application,
                  result
                );


                await updateLastChecked(
                  db,
                  application
                );


                console.log(
                  "Firebase application data updated."
                );

              } catch (error) {

                failedCount++;


                console.error(
                  "Application check failed:"
                );


                console.error(
                  error.message
                );

              }

            }


            // ========================================
            // Summary
            // ========================================

            console.log(
              "=========================================="
            );


            console.log(
              "Monitoring completed."
            );


            console.log(
              "Applications checked: "
                + checkedCount
            );


            console.log(
              "Status unchanged: "
                + unchangedCount
            );


            console.log(
              "Status changed: "
                + changedCount
            );


            console.log(
              "Notifications sent: "
                + notificationCount
            );


            console.log(
              "Failed checks: "
                + failedCount
            );


            console.log(
              "=========================================="
            );

          }


          // ==========================================
          // e-District SOAP request
          // ==========================================

          async function checkEdistrictStatus(
            applicationNumber,
            parser
          ) {

            const soapBody =

              '<?xml version="1.0" encoding="utf-8"?>'
              +
              '<soap:Envelope '
              +
              'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" '
              +
              'xmlns:xsd="http://www.w3.org/2001/XMLSchema" '
              +
              'xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">'
              +
              '<soap:Body>'
              +
              '<retAppStatus xmlns="'
              + NAMESPACE
              + '">'
              +
              '<application_no>'
              +
              escapeXml(
                applicationNumber
              )
              +
              '</application_no>'
              +
              '</retAppStatus>'
              +
              '</soap:Body>'
              +
              '</soap:Envelope>';


            const response =
              await fetch(
                SOAP_ADDRESS,
                {

                  method:
                    "POST",

                  headers: {

                    "Content-Type":
                      "text/xml; charset=utf-8",

                    "SOAPAction":
                      '"' + SOAP_ACTION + '"'

                  },

                  body:
                    soapBody

                }
              );


            if (
              !response.ok
            ) {

              throw new Error(
                "e-District API HTTP error: "
                  + response.status
              );

            }


            const xml =
              await response.text();


            if (
              !xml
              || !xml.trim()
            ) {

              throw new Error(
                "e-District API returned empty response."
              );

            }


            const parsed =
              parser.parse(
                xml
              );


            const result =
              extractApplicationData(
                parsed
              );


            if (
              !result.status
              && !result.name
              && !result.service
            ) {

              throw new Error(
                "Application data could not be parsed."
              );

            }


            return {

              name:
                result.name
                || "",

              status:
                result.status
                || "",

              location:
                result.location
                || "",

              movedOn:
                result.movedon
                || result.movedOn
                || "",

              certificateDownload:
                result.ic_download
                || "",

              service:
                result.service
                || ""

            };

          }


          // ==========================================
          // Send FCM notification
          // ==========================================

          async function sendStatusNotification(
            messaging,
            application,
            result
          ) {

            const newStatus =
              result.status
              || "नई स्थिति उपलब्ध है";


            const service =
              result.service
              || application.service
              || "e-District आवेदन";


            const applicationNumber =
              application.applicationNumber;


            const message = {

              token:
                application.fcmToken,

              notification: {

                title:
                  "🔔 e-District Status बदला",

                body:
                  service
                  + " • "
                  + newStatus

              },

              data: {

                type:
                  "STATUS_CHANGE",

                applicationNumber:
                  String(
                    applicationNumber
                  ),

                newStatus:
                  String(
                    newStatus
                  ),

                location:
                  String(
                    result.location
                    || ""
                  )

              }

            };


            await messaging.send(
              message
            );

          }


          // ==========================================
          // Update Firebase application
          // ==========================================

          async function updateApplication(
            db,
            application,
            result
          ) {

            const path =
              "users/"
              + application.uid
              + "/applications/"
              + application.applicationId;


            await db
              .ref(path)
              .update({

                currentStatus:
                  result.status
                  || "",

                location:
                  result.location
                  || "",

                lastUpdate:
                  result.movedOn
                  || "",

                updatedAt:
                  Date.now()

              });

          }


          // ==========================================
          // Last checked
          // ==========================================

          async function updateLastChecked(
            db,
            application
          ) {

            const path =
              "users/"
              + application.uid
              + "/applications/"
              + application.applicationId
              + "/lastCheckedAt";


            await db
              .ref(path)
              .set(
                Date.now()
              );

          }


          // ==========================================
          // Extract SOAP data
          // ==========================================

          function extractApplicationData(
            value
          ) {

            if (
              !value
              || typeof value !== "object"
            ) {

              return {};

            }


            const normalized = {};


            for (
              const key
              of Object.keys(value)
            ) {

              const lowerKey =
                key
                  .toLowerCase()
                  .replace(
                    /[^a-z0-9_]/g,
                    ""
                  );


              if (
                lowerKey === "name"
                &&
                typeof value[key] === "string"
              ) {

                normalized.name =
                  value[key];

              }


              if (
                lowerKey === "status"
                &&
                typeof value[key] === "string"
              ) {

                normalized.status =
                  value[key];

              }


              if (
                lowerKey === "location"
                &&
                typeof value[key] === "string"
              ) {

                normalized.location =
                  value[key];

              }


              if (
                (
                  lowerKey === "movedon"
                  ||
                  lowerKey === "movedondate"
                )
                &&
                typeof value[key] === "string"
              ) {

                normalized.movedon =
                  value[key];

              }


              if (
                (
                  lowerKey === "service"
                  ||
                  lowerKey === "servicename"
                )
                &&
                typeof value[key] === "string"
              ) {

                normalized.service =
                  value[key];

              }


              if (
                (
                  lowerKey === "ic_download"
                  ||
                  lowerKey === "icdownload"
                )
                &&
                typeof value[key] === "string"
              ) {

                normalized.ic_download =
                  value[key];

              }

            }


            if (
              normalized.name
              ||
              normalized.status
              ||
              normalized.service
            ) {

              return normalized;

            }


            for (
              const key
              of Object.keys(value)
            ) {

              const child =
                value[key];


              if (
                Array.isArray(child)
              ) {

                for (
                  const item
                  of child
                ) {

                  const found =
                    extractApplicationData(
                      item
                    );


                  if (
                    found.name
                    ||
                    found.status
                    ||
                    found.service
                  ) {

                    return found;

                  }

                }

              }


              if (
                child
                &&
                typeof child === "object"
              ) {

                const found =
                  extractApplicationData(
                    child
                  );


                if (
                  found.name
                  ||
                  found.status
                  ||
                  found.service
                ) {

                  return found;

                }

              }

            }


            return {};

          }


          // ==========================================
          // Normalize status
          // ==========================================

          function normalizeStatus(
            value
          ) {

            if (
              value === null
              ||
              value === undefined
            ) {

              return "";

            }


            return String(
              value
            )
              .trim()
              .replace(
                /\s+/g,
                " "
              );

          }


          // ==========================================
          // XML escape
          // ==========================================

          function escapeXml(
            value
          ) {

            return String(
              value
            )
              .replace(
                /&/g,
                "&amp;"
              )
              .replace(
                /</g,
                "&lt;"
              )
              .replace(
                />/g,
                "&gt;"
              )
              .replace(
                /"/g,
                "&quot;"
              )
              .replace(
                /'/g,
                "&apos;"
              );

          }


          // ==========================================
          // Start
          // ==========================================

          main()

            .then(
              () => {

                console.log(
                  "Node.js process completed successfully."
                );

                process.exit(
                  0
                );

              }
            )

            .catch(
              (error) => {

                console.error(
                  "=========================================="
                );

                console.error(
                  "Monitoring FAILED"
                );

                console.error(
                  "=========================================="
                );

                console.error(
                  error.message
                );

                process.exit(
                  1
                );

              }
            );

          EOF


          node monitor-edistrict.js
