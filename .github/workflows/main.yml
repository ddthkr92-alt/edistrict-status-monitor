name: eDistrict Status Monitor

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"


concurrency:
  group: edistrict-status-monitor
  cancel-in-progress: false


jobs:

  monitor-status:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # Node.js
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ========================================================
      # Install dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          npm init -y
          npm install firebase-admin fast-xml-parser


      # ========================================================
      # e-District API connectivity test
      # ========================================================

      - name: Test e-District API connectivity
        run: |

          echo "========================================"
          echo "e-District API Connectivity Test"
          echo "========================================"

          echo ""
          echo "Testing endpoint..."

          curl \
            --verbose \
            --connect-timeout 15 \
            --max-time 30 \
            "http://164.100.181.28/nichqreport/responseup.asmx" \
            -o /tmp/edistrict_response.txt \
            2>&1 || true

          echo ""
          echo "========================================"
          echo "Connectivity test completed"
          echo "========================================"


      # ========================================================
      # Monitor applications
      # ========================================================

      - name: Monitor e-District applications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

        run: |

          cat > monitor.js <<'EOF'

          const admin =
            require("firebase-admin");

          const {
            XMLParser
          } =
            require("fast-xml-parser");


          // ======================================================
          // Firebase
          // ======================================================

          const DATABASE_URL =
            "https://edistrict-status-test-default-rtdb.asia-southeast1.firebasedatabase.app";


          if (
            !process.env.FIREBASE_SERVICE_ACCOUNT_JSON
          ) {

            console.error(
              "FIREBASE_SERVICE_ACCOUNT_JSON secret नहीं मिला।"
            );

            process.exit(1);
          }


          let serviceAccount;


          try {

            serviceAccount =
              JSON.parse(
                process.env.FIREBASE_SERVICE_ACCOUNT_JSON
              );

          } catch (error) {

            console.error(
              "Firebase service account JSON invalid है।"
            );

            process.exit(1);
          }


          admin.initializeApp({

            credential:
              admin.credential.cert(
                serviceAccount
              ),

            databaseURL:
              DATABASE_URL

          });


          const database =
            admin.database();


          const messaging =
            admin.messaging();


          // ======================================================
          // e-District SOAP API
          // ======================================================

          const SOAP_ADDRESS =
            "http://164.100.181.28/nichqreport/responseup.asmx";


          const SOAP_ACTION =
            "http://tempuri.org/retAppStatus";


          const NAMESPACE =
            "http://tempuri.org/";


          const OPERATION_NAME =
            "retAppStatus";


          // ======================================================
          // Helpers
          // ======================================================

          function safe(
            value
          ) {

            if (
              value === null
                  ||
              value === undefined
            ) {

              return "";
            }


            return String(
              value
            ).trim();
          }


          function normalizeStatus(
            value
          ) {

            return safe(
              value
            )
              .replace(
                /\s+/g,
                " "
              )
              .trim()
              .toLowerCase();
          }


          // ======================================================
          // Delay helper
          // ======================================================

          function sleep(
            milliseconds
          ) {

            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  milliseconds
                )
            );
          }


          // ======================================================
          // Detailed error information
          // ======================================================

          function logNetworkError(
            error,
            attempt,
            applicationNumber
          ) {

            console.error(
              "----------------------------------------"
            );

            console.error(
              "e-District request failed"
            );

            console.error(
              "Application:",
              applicationNumber
            );

            console.error(
              "Attempt:",
              attempt
            );

            console.error(
              "Error name:",
              error?.name || ""
            );

            console.error(
              "Error message:",
              error?.message || ""
            );

            console.error(
              "Error code:",
              error?.code || ""
            );

            console.error(
              "Error errno:",
              error?.errno || ""
            );

            console.error(
              "Error type:",
              error?.type || ""
            );

            if (
              error?.cause
            ) {

              console.error(
                "Cause name:",
                error.cause.name || ""
              );

              console.error(
                "Cause message:",
                error.cause.message || ""
              );

              console.error(
                "Cause code:",
                error.cause.code || ""
              );

              console.error(
                "Cause errno:",
                error.cause.errno || ""
              );

              console.error(
                "Cause syscall:",
                error.cause.syscall || ""
              );

              console.error(
                "Cause address:",
                error.cause.address || ""
              );

              console.error(
                "Cause port:",
                error.cause.port || ""
              );
            }

            console.error(
              "----------------------------------------"
            );
          }


          // ======================================================
          // Single e-District API request
          // ======================================================

          async function checkEDistrictStatusOnce(
            applicationNumber
          ) {

            const soapBody =
              `<?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xmlns:xsd="http://www.w3.org/2001/XMLSchema"
              xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

              <soap:Body>

                <${OPERATION_NAME}
                    xmlns="${NAMESPACE}">

                  <application_no>
                    ${applicationNumber}
                  </application_no>

                </${OPERATION_NAME}>

              </soap:Body>

          </soap:Envelope>`;


            const response =
              await fetch(
                SOAP_ADDRESS,
                {

                  method:
                    "POST",

                  headers: {

                    "Content-Type":
                      "text/xml; charset=utf-8",

                    "SOAPAction":
                      `"${SOAP_ACTION}"`,

                    "Content-Length":
                      Buffer.byteLength(
                        soapBody
                      ).toString()

                  },

                  body:
                    soapBody,

                  signal:
                    AbortSignal.timeout(
                      30000
                    )

                }
              );


            if (
              !response.ok
            ) {

              throw new Error(
                `e-District HTTP error: ${response.status} ${response.statusText}`
              );
            }


            const xml =
              await response.text();


            if (
              !xml
                  ||
              xml.trim().length === 0
            ) {

              throw new Error(
                "e-District response खाली है।"
              );
            }


            const parser =
              new XMLParser(
                {
                  ignoreAttributes:
                    false,

                  removeNSPrefix:
                    true
                }
              );


            const parsed =
              parser.parse(
                xml
              );


            const envelope =
              parsed.Envelope
                  ||
              parsed["soap:Envelope"];


            const body =
              envelope?.Body
                  ||
              parsed.Body;


            const responseObject =
              body?.retAppStatusResponse;


            const resultObject =
              responseObject?.retAppStatusResult;


            if (
              !resultObject
            ) {

              console.error(
                "e-District XML response:"
              );

              console.error(
                xml.substring(
                  0,
                  3000
                )
              );

              throw new Error(
                "e-District response में retAppStatusResult नहीं मिला।"
              );
            }


            return {

              name:
                safe(
                  resultObject.name
                ),

              status:
                safe(
                  resultObject.status
                ),

              location:
                safe(
                  resultObject.location
                ),

              movedOn:
                safe(
                  resultObject.movedon
                ),

              download:
                safe(
                  resultObject.ic_download
                ),

              service:
                safe(
                  resultObject.service
                )

            };
          }


          // ======================================================
          // e-District API request with retry
          // ======================================================

          async function checkEDistrictStatus(
            applicationNumber
          ) {

            const maxAttempts =
              3;


            let lastError =
              null;


            for (
              let attempt = 1;
              attempt <= maxAttempts;
              attempt++
            ) {

              try {

                console.log(
                  `Checking e-District status. Attempt ${attempt}/${maxAttempts}`
                );


                const result =
                  await checkEDistrictStatusOnce(
                    applicationNumber
                  );


                console.log(
                  "e-District API request successful."
                );


                return result;

              }

              catch (error) {

                lastError =
                  error;


                logNetworkError(
                  error,
                  attempt,
                  applicationNumber
                );


                if (
                  attempt <
                  maxAttempts
                ) {

                  const delay =
                    attempt * 5000;


                  console.log(
                    `Retrying after ${delay / 1000} seconds...`
                  );


                  await sleep(
                    delay
                  );
                }
              }
            }


            throw lastError
              ||
              new Error(
                "e-District API request failed."
              );
          }


          // ======================================================
          // Send FCM data-only notification
          // ======================================================

          async function sendStatusChangeNotification(
            fcmToken,
            applicationNumber,
            service,
            newStatus,
            location
          ) {

            if (
              !fcmToken
            ) {

              console.log(
                "FCM token उपलब्ध नहीं है।"
              );

              return false;
            }


            const message = {

              token:
                fcmToken,

              data: {

                type:
                  "STATUS_CHANGE",

                applicationNumber:
                  safe(
                    applicationNumber
                  ),

                newStatus:
                  safe(
                    newStatus
                  ),

                location:
                  safe(
                    location
                  )

              },

              android: {

                priority:
                  "high"

              }

            };


            try {

              const messageId =
                await messaging.send(
                  message
                );


              console.log(
                "FCM data-only notification sent successfully."
              );


              console.log(
                "Message ID:",
                messageId
              );


              return true;

            }

            catch (error) {

              console.error(
                "FCM notification failed."
              );


              console.error(
                "FCM error:",
                error.message
              );


              return false;
            }
          }


          // ======================================================
          // Main monitor
          // ======================================================

          async function monitorApplications() {

            console.log(
              "========================================"
            );

            console.log(
              "e-District Status Monitor"
            );

            console.log(
              "Started:",
              new Date().toISOString()
            );

            console.log(
              "========================================"
            );


            const usersSnapshot =
              await database
                .ref(
                  "users"
                )
                .once(
                  "value"
                );


            const users =
              usersSnapshot.val()
                  || {};


            let totalApplications =
              0;


            let checkedApplications =
              0;


            let unchangedApplications =
              0;


            let changedApplications =
              0;


            let notificationCount =
              0;


            let failedApplications =
              0;


            for (
              const uid
              of Object.keys(
                users
              )
            ) {

              const user =
                users[uid]
                    || {};


              const fcmToken =
                safe(
                  user.fcmToken
                );


              const applications =
                user.applications
                    || {};


              for (
                const applicationId
                of Object.keys(
                  applications
                )
              ) {

                totalApplications++;


                const application =
                  applications[
                    applicationId
                  ]
                      || {};


                const applicationNumber =
                  safe(
                    application.applicationNumber
                      ||
                    applicationId
                  );


                if (
                  !applicationNumber
                ) {

                  failedApplications++;

                  continue;
                }


                try {

                  console.log(
                    "----------------------------------------"
                  );

                  console.log(
                    "Checking application:",
                    applicationNumber
                  );


                  const result =
                    await checkEDistrictStatus(
                      applicationNumber
                    );


                  checkedApplications++;


                  const oldStatus =
                    safe(
                      application.currentStatus
                    );


                  const newStatus =
                    safe(
                      result.status
                    );


                  const oldNormalized =
                    normalizeStatus(
                      oldStatus
                    );


                  const newNormalized =
                    normalizeStatus(
                      newStatus
                    );


                  const statusChanged =
                    oldNormalized !==
                    newNormalized;


                  const previousNotifiedStatus =
                    safe(
                      application.lastNotifiedStatus
                    );


                  const previousNotifiedNormalized =
                    normalizeStatus(
                      previousNotifiedStatus
                    );


                  const shouldNotify =
                    statusChanged
                        &&
                    newNormalized !==
                    previousNotifiedNormalized;


                  const now =
                    Date.now();


                  console.log(
                    "Old status:",
                    oldStatus
                  );

                  console.log(
                    "New status:",
                    newStatus
                  );

                  console.log(
                    "Status changed:",
                    statusChanged
                  );


                  // =================================================
                  // Status unchanged
                  // =================================================

                  if (
                    !statusChanged
                  ) {

                    unchangedApplications++;


                    await database
                      .ref(
                        `users/${uid}/applications/${applicationId}`
                      )
                      .update(
                        {

                          lastCheckedAt:
                            now,

                          updatedAt:
                            now

                        }
                      );


                    continue;
                  }


                  // =================================================
                  // Status changed
                  // =================================================

                  changedApplications++;


                  console.log(
                    "Status change detected."
                  );


                  if (
                    shouldNotify
                        &&
                    fcmToken
                  ) {

                    const sent =
                      await sendStatusChangeNotification(
                        fcmToken,
                        applicationNumber,
                        result.service,
                        newStatus,
                        result.location
                      );


                    if (
                      sent
                    ) {

                      notificationCount++;


                      await database
                        .ref(
                          `users/${uid}/applications/${applicationId}`
                        )
                        .update(
                          {

                            lastNotifiedStatus:
                              newStatus

                          }
                        );
                    }

                  } else if (
                    shouldNotify
                        &&
                    !fcmToken
                  ) {

                    console.log(
                      "Status changed but FCM token नहीं मिला।"
                    );
                  }


                  // =================================================
                  // Save latest status
                  // =================================================

                  await database
                    .ref(
                      `users/${uid}/applications/${applicationId}`
                    )
                    .update(
                      {

                        currentStatus:
                          newStatus,

                        location:
                          result.location,

                        lastUpdate:
                          result.movedOn,

                        updatedAt:
                          now,

                        lastCheckedAt:
                          now

                      }
                    );
                }

                catch (error) {

                  failedApplications++;


                  console.error(
                    "Application check failed."
                  );


                  console.error(
                    "Application:",
                    applicationNumber
                  );


                  console.error(
                    "Error:",
                    error?.message || error
                  );
                }
              }
            }


            // ======================================================
            // Summary
            // ======================================================

            console.log(
              "========================================"
            );

            console.log(
              "Monitoring completed."
            );


            console.log(
              "Total applications:",
              totalApplications
            );


            console.log(
              "Checked:",
              checkedApplications
            );


            console.log(
              "Unchanged:",
              unchangedApplications
            );


            console.log(
              "Status changed:",
              changedApplications
            );


            console.log(
              "Notifications sent:",
              notificationCount
            );


            console.log(
              "Failed:",
              failedApplications
            );


            console.log(
              "Completed:",
              new Date().toISOString()
            );


            console.log(
              "========================================"
            );
          }


          // ======================================================
          // Run
          // ======================================================

          monitorApplications()

            .then(
              () => {

                process.exit(
                  0
                );

              }
            )

            .catch(
              error => {

                console.error(
                  "Monitoring failed."
                );

                console.error(
                  error
                );

                process.exit(
                  1
                );
              }
            );

          EOF


          node monitor.js
