name: Test FCM Notification

on:
  workflow_dispatch:

jobs:

  test-fcm:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Setup Node.js
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22


      # ==========================================
      # Install Firebase Admin SDK
      # ==========================================

      - name: Install Firebase Admin SDK
        run: |

          npm init -y

          npm install firebase-admin


      # ==========================================
      # Send FCM Test Notification
      # ==========================================

      - name: Send FCM Test Notification

        env:

          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

        run: |

          cat > test-fcm.js <<'EOF'

          const {
            initializeApp,
            cert
          } = require("firebase-admin/app");


          const {
            getDatabase
          } = require("firebase-admin/database");


          const {
            getMessaging
          } = require("firebase-admin/messaging");


          // ==========================================
          // Firebase Database
          // ==========================================

          const DATABASE_URL =
            "https://edistrict-status-test-default-rtdb.asia-southeast1.firebasedatabase.app";


          // ==========================================
          // Main
          // ==========================================

          async function main() {

            console.log(
              "=========================================="
            );

            console.log(
              "eDistrict FCM Test"
            );

            console.log(
              "=========================================="
            );


            // ========================================
            // Check Secret
            // ========================================

            if (
              !process.env.FIREBASE_SERVICE_ACCOUNT_JSON
            ) {

              throw new Error(
                "Firebase service account secret is missing."
              );

            }


            // ========================================
            // Parse Service Account
            // ========================================

            const serviceAccount =
              JSON.parse(
                process.env.FIREBASE_SERVICE_ACCOUNT_JSON
              );


            // ========================================
            // Initialize Firebase
            // ========================================

            initializeApp({

              credential:
                cert(serviceAccount),

              databaseURL:
                DATABASE_URL

            });


            console.log(
              "Firebase Admin initialized successfully."
            );


            // ========================================
            // Firebase Services
            // ========================================

            const db =
              getDatabase();


            const messaging =
              getMessaging();


            // ========================================
            // Read Users
            // ========================================

            const snapshot =
              await db
                .ref("users")
                .once("value");


            if (
              !snapshot.exists()
            ) {

              throw new Error(
                "No users found in Firebase."
              );

            }


            const users =
              snapshot.val();


            let token = "";


            // ========================================
            // Find FCM Token
            // ========================================

            for (
              const uid
              of Object.keys(users)
            ) {

              const user =
                users[uid];


              if (
                user
                &&
                user.fcmToken
              ) {

                token =
                  String(
                    user.fcmToken
                  );

                break;

              }

            }


            if (
              !token
            ) {

              throw new Error(
                "FCM token not found in Firebase."
              );

            }


            console.log(
              "FCM token found."
            );


            // ========================================
            // Send Notification
            // ========================================

            const message = {

              token:
                token,

              notification: {

                title:
                  "🔔 e-District Test Notification",

                body:
                  "Server से FCM notification सफलतापूर्वक प्राप्त हुई।"

              },

              data: {

                type:
                  "FCM_TEST",

                source:
                  "github-actions"

              }

            };


            const messageId =
              await messaging.send(
                message
              );


            console.log(
              "FCM notification sent successfully."
            );


            console.log(
              "FCM message ID received."
            );


            console.log(
              messageId
            );


            console.log(
              "=========================================="
            );


            console.log(
              "FCM TEST COMPLETED SUCCESSFULLY"
            );


            console.log(
              "=========================================="
            );

          }


          // ==========================================
          // Start
          // ==========================================

          main()

            .then(
              () => {

                process.exit(
                  0
                );

              }
            )

            .catch(
              (error) => {

                console.error(
                  "=========================================="
                );


                console.error(
                  "FCM TEST FAILED"
                );


                console.error(
                  "=========================================="
                );


                console.error(
                  error.message
                );


                process.exit(
                  1
                );

              }
            );

          EOF


          node test-fcm.js
